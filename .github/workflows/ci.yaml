name: Portfolio source check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/js/portfolio.js
      - name: Check local links and assets
        run: python3 script/check_portfolio.py
